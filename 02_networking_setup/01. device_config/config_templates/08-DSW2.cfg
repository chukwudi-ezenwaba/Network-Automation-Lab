hostname DSW1

vlan 8
 name VLAN8
vlan 9
 name VLAN9
vlan 99
 name MGMT

interface e0/2
 description Uplink to CSW1
 no shutdown
 ip routing
 ip address 10.0.108.2 255.255.255.252

interface e0/0
 description Downlink to ASW3
 switchport mode access
 switchport access vlan 8,99
 spanning-tree portfast
 no shutdown

interface range e1/0 , e0/3
 channel-group 1 mode active
 switchport mode trunk
 switchport trunk native 99

interface e0/1
 description Downlink to ASW4
 switchport mode access
 switchport access vlan 9,99
 spanning-tree portfast
 no shutdown

interface vlan 99
 ip address 192.168.2.231 255.255.255.0
 no shutdown

ip domain-name ezenwaba.com
crypto key generate rsa
ip ssh version 2

username admin privilege 15 secret cisco123

line con 0
 logging synchronous

line vty 0 15
 transport input ssh
 login local
 logging synchronous

ip default-gateway 10.0.108.1 255.255.255.252
end 
write memory