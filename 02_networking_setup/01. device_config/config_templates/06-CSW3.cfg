hostname CSW3

vlan 3
 name VLAN3
vlan 99
 name MGMT

interface e0/1
 description Uplink to ER1
 no shutdown
 ip routing
 ip address 10.0.105.2 255.255.255.252

interface e0/1
 description Downlink to ASW6
 switchport mode access
 switchport access vlan 6
 spanning-tree portfast
 no shutdown

interface range e0/3 , e0/2
 channel-group 1 mode active
 switchport mode trunk
 switchport trunk native 99

interface vlan 99
 ip address 192.168.2.228 255.255.255.0
 no shutdown

router ospf 1
 network 0.0.0.0 255.255.255.255 area 0
 redistribute eigrp 1 subnets

ip domain-name ezenwaba.com
crypto key generate rsa
ip ssh version 2

username admin privilege 15 secret cisco123

line con 0
 logging synchronous

line vty 0 15
 transport input ssh
 login local
 logging synchronous

ip default-gateway 10.0.105.1 255.255.255.252
end 
write memory