# ZTP_Config.cfg
# Purpose: Zero Touch Provisioning (ZTP) setup guide — DHCP/TFTP and device mapping
# Last updated: 2026-03-26

# --------------------------------------------------
# Step 1 — Install and configure DHCP and TFTP
# --------------------------------------------------

# Install DHCP server package
sudo apt install isc-dhcp-server

# Edit the DHCP server configuration file (example):
# sudo nano /etc/dhcp/dhcpd.conf
sudo nano /etc/dhcp/dhcpd.conf

subnet 192.168.2.0 netmask 255.255.255.0 {
  range 192.168.2.100 192.168.2.200;
  option routers 192.168.2.1;

  # ZTP settings
  next-server 192.168.2.209;        # TFTP server (Ubuntu)
  filename "default.cfg";       # Fallback device config
}

# Edit the default interface for the DHCP server (example):
# sudo nano /etc/default/isc-dhcp-server
sudo nano /etc/default/isc-dhcp-server

# Set the interface for the DHCP server
INTERFACESv4="vmbr0"

# Restart the DHCP server to apply changes
sudo systemctl restart isc-dhcp-server

# Edit the TFTP server configuration file (example):
# sudo nano /etc/default/tftpd-hpa
sudo nano /etc/default/tftpd-hpa

# TFTP server settings
TFTP_DIRECTORY="/var/lib/tftpboot"
TFTP_ADDRESS="0.0.0.0:69"
TFTP_OPTIONS="--secure"

# Restart the TFTP server to apply changes
sudo systemctl restart tftpd-hpa

# --------------------------------------------------
# Step 2 — Create device configuration files
# --------------------------------------------------

# Create the TFTP directory if it does not exist
mkdir -p /var/lib/tftpboot

# Change to the TFTP directory
cd /var/lib/tftpboot

# Create the configuration file for the device (example)
nano OR1.cfg

# --------------------------------------------------
# Step 3 — Map device MAC addresses to configuration files
# --------------------------------------------------

# Add host entries to /etc/dhcp/dhcpd.conf to map devices
# Example host entries:

host OR1 {
  hardware ethernet AA:BB:CC:DD:EE:01;
  fixed-address 192.168.2.11;
  filename "OR1.cfg";
}

host CSW1 {
  hardware ethernet AA:BB:CC:DD:EE:02;
  fixed-address 192.168.2.12;
  filename "CSW1.cfg";
}

# Restart the DHCP server to apply host entries
sudo systemctl restart isc-dhcp-server

# --------------------------------------------------
# Step 4 — Prepare devices for ZTP
# --------------------------------------------------

# On network devices, enable DHCP for management and allow ZTP to retrieve configuration
# Typical device steps:
write erase
reload

# --------------------------------------------------
# Step 5 — Ensure network reachability
# --------------------------------------------------

# Devices must be able to reach the DHCP/TFTP server.
# Options:
# - Place the DHCP/TFTP server in the same broadcast domain
# - Configure DHCP relay (ip helper-address) on relevant routers

# Example router interface configuration:
# interface e0/1
#  ip helper-address 10.0.0.10