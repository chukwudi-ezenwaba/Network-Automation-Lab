hostname ASW4

vlan 9
 name VLAN9
vlan 99
 name MGMT

interface e0/0
 description Uplink to DSW2
 switchport mode access
 switchport access vlan 9
 no shutdown

interface vlan 99
 ip address 192.168.2.235 255.255.255.0
 no shutdown

ip domain-name ezenwaba.com
crypto key generate rsa
ip ssh version 2

username admin privilege 15 secret cisco123

line con 0
 logging synchronous

line vty 0 15
 transport input ssh
 login local
 logging synchronous

ip default-gateway X.X.X.X 255.255.255.252
end 
write memory