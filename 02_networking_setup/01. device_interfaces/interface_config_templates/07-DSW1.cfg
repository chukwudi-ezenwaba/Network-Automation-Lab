hostname DSW1

vlan 4
 name VLAN4
vlan 6
 name VLAN6
vlan 99
 name MGMT

interface e0/2
 description Uplink to OR1
 no shutdown
 ip routing
 ip address 10.0.0.6 255.255.255.252

interface e0/0
 description Downlink to ASW1
 switchport mode access
 switchport access vlan 6
 spanning-tree portfast
 no shutdown

interface range e1/0 , e0/3
 channel-group 1 mode active
 switchport mode trunk
 switchport trunk native 99

interface e0/1
 description Downlink to ASW2
 switchport mode access
 switchport access vlan 6
 spanning-tree portfast
 no shutdown

interface vlan 99
 ip address 192.168.2.230 255.255.255.0
 no shutdown

ip domain-name ezenwaba.com
crypto key generate rsa
ip ssh version 2

username admin privilege 15 secret cisco123

line con 0
 logging synchronous

line vty 0 15
 transport input ssh
 login local
 logging synchronous

ip default-gateway 10.0.101.1 255.255.255.252
end 
write memory