! OSPF example configuration for routers
router ospf 1
 network 10.0.0.0 0.255.255.255 area 0
 network 192.168.0.0 0.0.255.255 area 0
!
! Example: set passive-interface for interfaces that should not form adjacencies
! passive-interface GigabitEthernet0/0
!
! Optional: set router-id
! router-id 1.1.1.1
